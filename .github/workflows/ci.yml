name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" build

      - name: Lint (ruff)
        run: ruff check src tests tools

      - name: Tests (full pipeline on synthetic data, data-quality rules, reconciliations)
        run: pytest -q

      - name: Build wheel for the Fabric environment
        run: python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: mfgops-wheel
          path: dist/*.whl
